<!DOCTYPE html>
<html>
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
</head>
<body>
  <div id="fb" style="width:800px;height:500px;">
    <div>Page 1</div>
    <div>Page 2</div>
    <div>Page 3</div>
    <div>Page 4</div>
  </div>
  <script>
    $(document).ready(function(){
      $('#fb').turn({ width: 800, height: 500, autoCenter: true });
      console.log('TurnJS initialized successfully, page count:', $('#fb').turn('pages'));
    });
  </script>
</body>
</html>
